<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calper · Pesquisa de visita à obra</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:light;--bg:#fff;--soft:#f6f6f7;--card:#fff;--ink:#1c1c1f;--mut:#65656d;--line:#e4e4e8;--blue:#a42a31;--blue2:#f8eeee;--red:#a42a31;--onb:#fff;--c5:#2b2b30;--c4:#77777f;--c3:#d4d4d9;--c2:#e6b4b7;--c1:#a42a31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
.top{border-bottom:1px solid var(--line);border-top:3px solid var(--red);background:var(--bg)}
.top .in{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.logo img{height:46px;width:auto;display:block}
.logo span{color:var(--mut);font-size:.88rem;border-left:1px solid var(--line);padding-left:10px}
#tabs{display:flex;gap:2px}
#tabs button{border:0;background:none;color:var(--mut);font:500 .95rem inherit;font-family:inherit;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
#tabs button.on{color:var(--blue);border-color:var(--red);font-weight:600}
.wrap{margin:0 auto;padding:22px 16px 60px;max-width:540px}
.wrap.adm{max-width:1040px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:14px}
.sim{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:.84rem;color:var(--mut)}
.sim select{width:auto;flex:1;min-width:180px;padding:6px 8px;font-size:.88rem}
.ctx{margin-bottom:16px}.evtag{display:block;background:var(--red);color:#fff;font-size:1.05rem;font-weight:600;line-height:1.35;padding:10px 14px;border-radius:8px;margin-bottom:8px}
.ctx{background:var(--red);border-radius:8px;padding:12px 16px}
.ctx h1{font-size:1.15rem;font-weight:600;color:#fff;margin:0}
div.ctx p{color:#f3d9db}
.etq{display:inline-block;background:var(--blue2);color:var(--red);font-size:1.02rem;font-weight:600;line-height:1.35;padding:7px 14px;border-left:4px solid var(--red);border-radius:3px;margin:0 0 8px}.ctx p{margin:2px 0 0;color:var(--mut);font-size:.92rem}
.prog{margin-bottom:16px}
.prog .t{display:flex;justify-content:space-between;font-size:.86rem;color:var(--mut);margin-bottom:6px;font-weight:500}
.bar{height:8px;background:var(--blue2);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .3s}
.q{margin:0 0 18px}.q>label,.q>.l{display:block;font-weight:500;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.opts.two{grid-template-columns:1fr 1fr}
.opts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:12px 2px;min-height:48px;font:500 .8rem/1.2 inherit;font-family:inherit;cursor:pointer}
.opts.two button{font-size:.95rem}
.opts button.on{background:var(--blue);border-color:var(--blue);color:var(--onb);font-weight:600}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=datetime-local],textarea,select{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:12px 18px;font:600 .95rem inherit;font-family:inherit;cursor:pointer;background:var(--blue);color:var(--onb);text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.back{background:#eceef0;color:#3d3d44}
.btn.sm{padding:6px 10px;font-size:.82rem}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:6px}
.err{color:var(--red);font-size:.88rem;margin:6px 0 0;font-weight:500}
.sub{color:var(--mut);font-size:.9rem;margin:2px 0 12px}
.center{text-align:center;padding:30px 12px}
.sub2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.sub2 button,.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 .88rem inherit;font-family:inherit;padding:7px 13px;border-radius:6px;cursor:pointer}
.sub2 button.on{background:var(--blue);border-color:var(--blue);color:var(--onb)}
.sub2 select{width:auto;padding:7px 10px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:8px;padding:12px 14px}
.kpi.r{border-top-color:var(--red)}
.kpi b{display:block;font-size:1.75rem;font-weight:700;color:var(--ink);line-height:1.2}.kpi span{font-size:.82rem;color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th{font-weight:600;color:var(--mut);font-size:.82rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
.tag{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue2);color:var(--red)}
.tag.cl{background:var(--soft);color:var(--mut)}
.up{color:var(--ink);font-weight:600}.down{color:var(--red);font-weight:600}
.dist{margin-bottom:14px}.dist .name{font-size:.92rem;display:flex;justify-content:space-between;margin-bottom:4px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--soft)}.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-bottom:12px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;text-decoration:none}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.grid2{grid-template-columns:3fr 2fr}}
blockquote{margin:0 0 8px;padding:8px 12px;border-left:3px solid var(--red);background:var(--soft);border-radius:0 6px 6px 0;font-size:.9rem}
.qr{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#qrbox{background:#fff;padding:10px;border:1px solid var(--line);border-radius:8px;line-height:0}
.note{border-left:3px solid var(--blue);background:var(--blue2);padding:9px 12px;border-radius:0 6px 6px 0;font-size:.88rem;margin-bottom:14px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#tabs button{font-weight:600}
.btn.wa{background:#148f43;color:#fff}
.btn.wa:hover{background:#0f7a39}
.intro{background:var(--blue2);border-left:4px solid var(--red);border-radius:6px;padding:12px 14px;margin-bottom:16px;font-size:.95rem}
.intro b{display:block;margin-bottom:2px}
@media print{#tabs,.sub2,.noprint{display:none!important}body{background:#fff}.wrap,.wrap.adm{max-width:none;padding:12px 0 0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card,.kpi,.dist,blockquote{break-inside:avoid}.grid2{grid-template-columns:1fr}.top .in{padding-top:0}@page{margin:12mm}}
.cm{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.cmh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.cmh b{margin-right:2px}
.cm blockquote{margin:0 0 6px}.cm blockquote:last-child{margin-bottom:0}
.cmlist{max-height:75vh;overflow:auto;padding-right:2px}
@media print{.cm{break-inside:avoid}.cmcard{break-inside:auto!important}.cmlist{max-height:none;overflow:visible}}
@media print{body.pq #app>*:not(.qrposter){display:none!important}}
.btn[disabled]{opacity:.6;cursor:default}
details.card>summary{cursor:pointer;font-weight:600}
.onlyprint{display:none}@media print{.onlyprint{display:block}}
</style>
</head>
