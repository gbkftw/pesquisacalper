<style>

.ctx{margin-bottom:16px}.evtag{display:block;background:var(--red);color:#fff;font-size:1.05rem;font-weight:600;line-height:1.35;padding:10px 14px;border-radius:8px;margin-bottom:8px}

.prog{margin-bottom:16px}

.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.opts.two{grid-template-columns:1fr 1fr}
.opts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:12px 2px;min-height:48px;font:500 .8rem/1.2 inherit;font-family:inherit;cursor:pointer}

textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:12px 18px;font:600 .95rem inherit;font-family:inherit;cursor:pointer;background:var(--blue);color:var(--onb);text-decoration:none;display:inline-block}

.nav{display:flex;gap:10px;justify-content:space-between;margin-top:6px}

.sub{color:var(--mut);font-size:.9rem;margin:2px 0 12px}
.center{text-align:center;padding:30px 12px}
.sub2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}

th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
.tag{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--blue2);color:var(--red)}
.tag.cl{background:var(--soft);color:var(--mut)}
.up{color:var(--ink);font-weight:600}.down{color:var(--red);font-weight:600}
.dist{margin-bottom:14px}.dist .name{font-size:.92rem;display:flex;justify-content:space-between;margin-bottom:4px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--soft)}.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--mut);margin-bottom:12px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;text-decoration:none}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.grid2{grid-template-columns:3fr 2fr}}
blockquote{margin:0 0 8px;padding:8px 12px;border-left:3px solid var(--red);background:var(--soft);border-radius:0 6px 6px 0;font-size:.9rem}
.qr{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#qrbox{background:#fff;padding:10px;border:1px solid var(--line);border-radius:8px;line-height:0}
.note{border-left:3px solid var(--blue);background:var(--blue2);padding:9px 12px;border-radius:0 6px 6px 0;font-size:.88rem;margin-bottom:14px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#tabs button{font-weight:600}
.btn.wa{background:#148f43;color:#fff}
.btn.wa:hover{background:#0f7a39}
.intro{background:var(--blue2);border-left:4px solid var(--red);border-radius:6px;padding:12px 14px;margin-bottom:16px;font-size:.95rem}
.intro b{display:block;margin-bottom:2px}

.cm{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--card)}
.cmh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.cmh b{margin-right:2px}
.cm blockquote{margin:0 0 6px}.cm blockquote:last-child{margin-bottom:0}
.cmlist{max-height:75vh;overflow:auto;padding-right:2px}
@media print{.cm{break-inside:avoid}.cmcard{break-inside:auto!important}.cmlist{max-height:none;overflow:visible}}
@media print{body.pq .admmain>*:not(.qrposter){display:none!important}}
.btn[disabled]{opacity:.6;cursor:default}
details.card>summary{cursor:pointer;font-weight:600}
.onlyprint{display:none}@media print{.onlyprint{display:block}}
:root{--g1:#1f7a4d;--g2:#8fcaa6;--ne:#d4d4d9;--r2:#e6a1a5;--r1:#a42a31}
.kpi b.sm{font-size:1.05rem;line-height:1.3;padding:4px 0}
.dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}.dn{font-weight:500;flex:1;min-width:150px}
.sat,.avg{font-size:.8rem;color:var(--mut)}.sat b{font-size:1.35rem;color:var(--ink);margin-right:3px}
.tr{font-size:.8rem;font-weight:600;color:var(--mut)}.tr.up{color:var(--g1)}.tr.dn{color:var(--r1)}
.dv{display:flex;gap:2px;height:26px}
.dv i{flex:none;border-radius:3px;display:flex;align-items:center;justify-content:center;font:600 .7rem/1 inherit;font-family:inherit;font-style:normal;white-space:nowrap;overflow:hidden;height:100%}

.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.flt select{width:auto;padding:7px 10px;font-size:.88rem}

.cm2{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:720px){.cm2{grid-template-columns:1fr 1fr}}
.cmi{margin-bottom:10px;padding:8px 12px;border:1px solid var(--line);border-radius:8px}

.cmi .cmh{margin-bottom:0}.cmi blockquote{margin:6px 0 0}
@media print{.cmi,.dist{break-inside:avoid}}
.cm.low{border-color:var(--r1);border-left:4px solid var(--r1);background:#fdf6f6}

.tag.bu{background:#ececef;color:#1c1c1f;font-weight:700}
.tag.rp{background:#e3edfb;color:#1d4f91}
.side{position:fixed;left:0;top:0;bottom:0;width:260px;background:#262c35;color:#fff;display:flex;flex-direction:column;padding:30px 14px 18px;overflow-y:auto;z-index:20}
.side .lg{padding:0 10px 34px}.side .lg img{height:52px;width:auto;display:block;filter:brightness(0) invert(1)}
.side button.it{display:block;width:100%;text-align:left;background:none;border:0;color:#9aa3b2;font-family:inherit;font-size:1.02rem;font-weight:600;line-height:1.3;padding:14px 16px;border-radius:9px;cursor:pointer;margin-bottom:6px;transition:background .15s,color .15s}
.side button.it:hover{background:rgba(255,255,255,.07);color:#fff}

.side .rf:hover{background:rgba(255,255,255,.08)}

.side .un{min-width:0;flex:1}.side .un b{display:block;font-size:.95rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side .un small{color:#9aa3b2;font-size:.8rem}

body.hs .top{display:none}

/* Botões: vermelho com degradê e sombra, secundários brancos */
.btn{font-family:inherit;font-size:.95rem;font-weight:700;line-height:1.2;border-radius:12px;padding:12px 22px;color:#fff;background:linear-gradient(180deg,#e2232e 0%,#b8131c 100%);border:0;box-shadow:0 6px 14px -4px rgba(190,20,30,.45),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 10px 18px -6px rgba(190,20,30,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.btn:active{transform:translateY(0);box-shadow:0 3px 8px -3px rgba(190,20,30,.5)}
.btn.ghost,.btn.back{background:#fff;color:#1c1c1f;border:1px solid #e2e2e7;box-shadow:0 1px 3px rgba(20,20,30,.06)}
.btn.ghost:hover,.btn.back:hover{filter:none;border-color:#c9c9d0;box-shadow:0 4px 10px -4px rgba(20,20,30,.15)}
.btn.wa{background:linear-gradient(180deg,#1ea653 0%,#12803d 100%);box-shadow:0 6px 14px -4px rgba(18,128,61,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.wa:hover{background:linear-gradient(180deg,#1ea653 0%,#12803d 100%)}
.btn.sm{font-size:.84rem;padding:8px 14px;border-radius:10px}
.btn[disabled],.btn[disabled]:hover{opacity:.6;transform:none;filter:none}
.sub2 button,.chip{font-family:inherit;font-size:.88rem;font-weight:600;border-radius:10px;padding:8px 14px;border:1px solid #e2e2e7;background:#fff;box-shadow:0 1px 3px rgba(20,20,30,.06)}
.sub2 button:hover{border-color:#c9c9d0}
.sub2 button.on,.opts button.on{background:linear-gradient(180deg,#e2232e 0%,#b8131c 100%);border-color:#b8131c;color:#fff;box-shadow:0 6px 14px -4px rgba(190,20,30,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.opts button{font-family:inherit;font-size:.8rem;font-weight:500;line-height:1.2;border-radius:10px}
.opts.two button{font-size:.95rem}
td:last-child .btn.sm{white-space:nowrap}td:last-child:has(.btn){white-space:nowrap}

#rp.glass .tag.bad{background:rgba(226,35,46,.22);color:#ffb3b8}
#rp.glass .tag.okt{background:rgba(31,160,90,.2);color:#8fe0b5}
#rp.glass .tag.cl{background:rgba(255,255,255,.1);color:#d6dbe2}
#rp.glass .cm{background:rgba(255,255,255,.03)}
#rp.glass .cm.low{background:rgba(226,35,46,.1);border-color:rgba(226,35,46,.5)}
#rp.glass input[type=text],#rp.glass input[type=search],#rp.glass input[type=email]{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.15)}
#rp.glass input::placeholder{color:#8f97a3}
#rp.glass .err{color:#ff9aa0}#rp.glass details summary{color:#fff}
#rp.glass .btn.ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
#rp.glass .up{color:#5fd497}#rp.glass .down{color:#ff8f96}
/* tema claro: cartões brancos */
#rp.white .card,#rp.white .kpi{box-shadow:0 14px 34px -18px rgba(0,0,0,.7);border-color:transparent}
.tag.okt{background:#e2f2e9;color:var(--g1)}
.heat{display:inline-block;min-width:46px;text-align:center;border-radius:6px;padding:3px 6px;font-weight:700;font-size:.82rem}
.grh{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}.grh>div:first-child{flex:1;min-width:240px}
.seg2{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:11px}.seg2 button{border:0;background:none;color:inherit;padding:7px 13px;border-radius:8px;font-family:inherit;font-weight:600;font-size:.86rem;cursor:pointer}
.seg2 button.on{background:linear-gradient(180deg,#e2232e,#b8131c);color:#fff;box-shadow:0 4px 10px -4px rgba(190,20,30,.5)}
.tm{display:flex;flex-direction:column;gap:6px}
.tmr{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 88px;gap:10px;align-items:center;background:none;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;color:inherit;text-align:left;font-family:inherit}
.tmr:hover{border-color:var(--red)}.tn{font-weight:600;font-size:.9rem}.tc{font-size:.8rem;color:var(--mut);text-align:right}
.tmr i{height:8px;border-radius:9px;background:rgba(128,128,140,.2);overflow:hidden}.tmr i b{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#e2232e,#b8131c)}
.evg{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.evg{grid-template-columns:1fr}}
.evc{border:1px solid var(--line);border-radius:9px;padding:10px 10px 4px;min-width:0}.evh{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--mut)}.evh b{font-size:1.2rem;color:var(--ink)}
.evc svg{width:100%;height:auto;display:block}.evc .ax{stroke:var(--line);stroke-width:1}.evc .ln{fill:none;stroke:#d11f2a;stroke-width:2.5;stroke-linejoin:round}.evc .ar{fill:rgba(209,31,42,.12)}.evc .pt{fill:#d11f2a}.evc .pt.last{stroke:#fff;stroke-width:2}
.evc .vl{font-size:11px;font-weight:700;text-anchor:middle;fill:var(--ink)}.evc .xl{font-size:10px;text-anchor:middle;fill:var(--mut)}
/* explorador de comentários */
.cx{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:400px}
@media(max-width:860px){.cx{grid-template-columns:1fr}}
.cxl0{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:rgba(128,128,140,.06)}
.cxf{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.cxf input{width:100%;padding:9px 11px}
.cxch{display:flex;gap:5px;flex-wrap:wrap}#rp .cxch .chip{padding:5px 10px;font-size:.78rem}
.cxs{overflow:auto;max-height:460px}
.cxi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:none;padding:10px 12px;cursor:pointer;color:inherit;font-family:inherit}
.cxi:hover{background:rgba(128,128,140,.08)}.cxi.on{background:rgba(128,128,140,.12);border-left-color:var(--red)}
.cxi .t{display:flex;gap:6px;align-items:center}.cxi .t b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cxi .p{display:block;margin-top:3px;font-size:.8rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.cxd{padding:18px 20px;min-width:0}.cxd .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.cxd .hd h3{margin:0 4px 0 0;font-size:1.2rem}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin-bottom:14px}
.ans div{border:1px solid var(--line);border-radius:9px;padding:8px 10px}.ans span{display:block;font-size:.74rem;color:var(--mut)}.ans b{font-size:.92rem}
.ans .lo{border-color:rgba(226,35,46,.45);background:rgba(226,35,46,.08)}.ans .lo b{color:var(--r1)}#rp.glass .ans .lo b{color:#ff9aa0}
blockquote.f{border-left-color:var(--g1)}blockquote.m{border-left-color:var(--r1)}
.cxe{color:var(--mut);padding:30px;text-align:center;margin:0}
/* envio automático */
.mail{margin-top:14px}.mh2{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.mh2>div{flex:1;min-width:240px}
.sw{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem;cursor:pointer;position:relative}.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{width:40px;height:22px;border-radius:99px;background:#9aa0aa;position:relative;transition:background .15s}.sw span:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked+span{background:#1f7a4d}.sw input:checked+span:after{left:21px}.sw input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.mrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.mchips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:200px}
.mc{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:.85rem;font-weight:600}
.mc button{border:0;background:rgba(128,128,140,.2);color:inherit;width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1}
.madd{display:flex;gap:6px;flex-wrap:wrap}.madd input{width:auto;min-width:220px;padding:8px 11px}
.okm{color:var(--g1);font-weight:600;font-size:.88rem;margin:8px 0 0}#rp.glass .okm{color:#8fe0b5}
#rp details.card{margin-top:14px}
.flp,.gen{color:#c9ced8;font-size:.82rem;margin:8px 4px}
/* novo evento / empreendimento */
.ne{margin-bottom:14px;align-items:start}
.erw{display:flex;gap:8px;flex-wrap:wrap}.erw select{flex:1;min-width:200px;width:auto}
.einfo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:-4px 0 8px}.einfo div{background:var(--soft);border-radius:10px;padding:10px}.einfo b{display:block;font-size:1.15rem}.einfo span{font-size:.74rem;color:var(--mut)}
@media(max-width:600px){.einfo{grid-template-columns:1fr 1fr}}
.bchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.blist{display:flex;flex-direction:column;gap:6px}.brw{display:grid;grid-template-columns:1fr 1fr 40px;gap:6px}.bx{border:1.5px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:1.1rem}
.lnk{border:0;background:none;color:var(--red);font-family:inherit;font-weight:700;font-size:.88rem;padding:6px 0;cursor:pointer}
.tbox{background:var(--blue2);border-radius:10px;padding:12px 14px;margin-bottom:14px}.tbox b{font-size:1.3rem;color:var(--red)}
.upb{display:grid!important;place-items:center;height:100px;border:1.5px dashed #c9cbd2;border-radius:10px;cursor:pointer;color:var(--mut);font-weight:500!important;font-size:.88rem;background:#fafafb center/cover no-repeat;overflow:hidden;position:relative;margin:0!important}
.upb img{max-height:76px;max-width:90%}.upb input{position:absolute;opacity:0;width:1px;height:1px}
tr.tt td{font-weight:700;border-bottom:0}
@media print{#rp{border-radius:0;padding:14px}#rp .sh{break-after:avoid}#rp .card,#rp .kpi{-webkit-backdrop-filter:none;backdrop-filter:none}#rp.glass .card,#rp.glass .kpi{background:#1f242c}#rp .grid2{grid-template-columns:3fr 2fr}.g2b{grid-template-columns:1fr 1fr}#rp .hin{grid-template-columns:1.15fr 1.85fr}#rp .cmlist{max-height:none;overflow:visible}.hkp{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(255,255,255,.1)}}

.btn.ghost.dx{color:var(--red);border-color:#efc4c7}.btn.ghost.dx:hover{border-color:var(--red)}
.dxc{border:1.5px solid #e9a6aa!important;background:#fff8f8!important}
.dxw{background:#fbe3e4;color:#7c1d22;border-radius:8px;padding:10px 12px;margin:0 0 10px}
.dxo{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}.dxo label{display:flex;gap:8px;align-items:center;cursor:pointer}
.btn.dxb{background:linear-gradient(180deg,#b8131c,#8e0f16)}
</style>
